name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 权限：读代码 + 写 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 串行部署，避免并发推送互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # 项目站点（用户名.github.io/<仓库名>/）需要子路径前缀；
          # 用自定义域名或 <用户名>.github.io 仓库时改为 BASE_PATH: "/"
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          # 把 Pages 的正式地址写进 canonical/OG 标签
          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          node -e "
            const fs=require('fs');
            const p='content/site.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.siteUrl=process.env.SITE_URL;
            fs.writeFileSync(p,JSON.stringify(j,null,'\t'));
          "
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
